name: Copy to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy uploaded file to index.html
        run: cp dibuja-y-adivina.html index.html
      - name: Commit index.html
        run: |
          git config user.name "thedecro3312-ux"
          git config user.email "thedecro3312-ux@users.noreply.github.com"
          git add index.html
          git commit -m "Update index.html with back button to Sala de Juegos" || echo "No changes to commit"
          git push
