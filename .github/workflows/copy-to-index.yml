name: Copy to index

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copy file to index.html
        run: |
          cp dibuja-y-adivina.html index.html
          rm dibuja-y-adivina.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u dibuja-y-adivina.html
          git commit -m "Publish updated Dibuja y Adivina page" || echo "Nothing to commit"
          git push
