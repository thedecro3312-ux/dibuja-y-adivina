name: Copy to index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy uploaded file to index.html
        run: cp dibuja-y-adivina.html index.html
      - name: Commit index.html and remove uploaded file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm dibuja-y-adivina.html
          git commit -m "Update index.html" || echo "No changes to commit"
          git push
